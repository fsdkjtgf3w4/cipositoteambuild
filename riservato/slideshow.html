<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>CipoCity</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  #slideshow {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  #slideshow img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover; /* riempie lo schermo senza deformare */
    opacity: 0;
    transition: all 1s ease;
  }
  .fade { opacity: 1; transform: none; }
  .slide-left { opacity: 1; transform: translateX(0); }
  .slide-right { opacity: 1; transform: translateX(0); }
  .zoom { opacity: 1; transform: scale(1); }
  .rotate { opacity: 1; transform: rotate(0deg); }
</style>
</head>
<body>

<div id="slideshow">
  <img src="https://i.ibb.co/JjYWs4q4/2026-03-17-17-34-07.png">
  <img src="https://i.ibb.co/XfVr4LVS/2026-03-17-17-34-26.png">
  <img src="https://i.ibb.co/x8GqHK70/2026-03-17-17-35-19.png">
  <img src="https://i.ibb.co/d0qwRHYB/2026-03-17-17-35-30.png">
  <img src="https://i.ibb.co/F2F4d6b/2026-03-17-17-35-49.png">
  <img src="https://i.ibb.co/7tbbyVH2/2026-03-17-17-36-12.png">
  <img src="https://i.ibb.co/yFB1DFSn/2026-03-17-17-36-30.png">
  <img src="https://i.ibb.co/Nghsd9f0/2026-03-17-17-36-47.png">
  <img src="https://i.ibb.co/mrLh42t0/2026-03-17-17-37-26.png">
  <img src="https://i.ibb.co/WWSjHMFW/2026-03-17-17-37-43.png">
  <img src="https://i.ibb.co/NnQXFTxr/2026-03-17-17-37-53.png">
  <img src="https://i.ibb.co/VWW1Hj6F/2026-03-17-17-38-14.png">
  <img src="https://i.ibb.co/1GLcZ60P/2026-03-17-17-38-31.png">
  <img src="https://i.ibb.co/C51p5mYk/2026-03-17-17-38-57.png">

  <img src="https://i.ibb.co/9F5TQ8p/2026-03-17-17-39-54.png">
</div>

<script>
const images = document.querySelectorAll('#slideshow img');
const effects = ['fade', 'slide-left', 'slide-right', 'zoom', 'rotate'];
let current = 0;

images[current].className = 'fade';

function showNextImage() {
  images[current].style.opacity = 0;

  current = (current + 1) % images.length;
  const effect = effects[Math.floor(Math.random() * effects.length)];
  
  images[current].style.opacity = 1;
  images[current].className = effect;
}

setInterval(showNextImage, 3000);
</script>

</body>
</html>
