<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CipoCity Visa Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<!-- LIBRERIA PER IL DOWNLOAD DIRETTO DEL PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
:root{
    --bg:#0f172a;
    --card:#111827;
    --accent:#3b82f6;
    --accent-hover:#2563eb;
    --accent2:#22c55e;
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:#1f2937;
}
*{box-sizing:border-box}
body{
    margin:0;
    font-family:'Inter',Segoe UI,Arial,sans-serif;
    background:linear-gradient(135deg,#0f172a,#111827);
    color:var(--text);
    min-height:100vh;
    padding:20px 0;
}
.container{
    max-width:850px;
    margin:auto;
    padding:0 24px;
}
.card{
    background:rgba(17,24,39,.96);
    border:1px solid var(--border);
    border-radius:18px;
    padding:32px;
    animation:fade .3s ease-out;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}
h1,h2,h3{margin-top:0; margin-bottom:16px; color:#fff;}
p{color:var(--muted); line-height:1.5;}
input,textarea,select{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #334155;
    background:#0b1220;
    color:white;
    margin-top:8px;
    font-family:inherit;
    font-size:15px;
    transition:border 0.2s;
}
input:focus, textarea:focus {
    outline:none;
    border-color:var(--accent);
}
textarea{min-height:120px; resize:vertical;}
.actions{
    margin-top:24px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}
button{
    border:none;
    cursor:pointer;
    padding:14px 22px;
    border-radius:12px;
    font-weight:600;
    font-size:15px;
    font-family:inherit;
    transition:transform 0.1s, filter 0.2s;
}
button:active { transform:scale(0.97); }
button:hover { filter:brightness(1.1); }
button:disabled { opacity: 0.7; cursor: not-allowed; }
.primary{background:var(--accent);color:white;}
.success{background:var(--accent2);color:white;}
.secondary{background:#334155;color:white;}
.progress{
    width:100%;
    height:8px;
    background:#1e293b;
    border-radius:999px;
    overflow:hidden;
    margin-bottom:24px;
}
.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#3b82f6,#22c55e);
    transition:width .4s ease;
}
.badge{
    display:inline-block;
    padding:6px 12px;
    border-radius:999px;
    background:rgba(217,119,6,0.2);
    border:1px solid #d97706;
    color:#fde68a;
    font-weight:600;
    font-size:13px;
    margin-bottom:16px;
}
.loader{
    width:50px;
    height:50px;
    border:4px solid #334155;
    border-top-color:#3b82f6;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:25px auto;
}
.summary{
    background:#0b1220;
    border:1px solid #1e293b;
    border-radius:12px;
    padding:20px;
    margin-top:16px;
}
.summary b { color:#cbd5e1; }
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{
    from{opacity:0;transform:translateY(15px)}
    to{opacity:1;transform:none}
}
@media(max-width:700px){
    .card{padding:24px}
}
</style>
</head>
<body>

<div class="container">
    <div class="progress">
        <div class="progress-bar" id="bar"></div>
    </div>
    <div id="app"></div>
</div>

<script>
const app = document.getElementById("app");
const bar = document.getElementById("bar");

const form = {
    minecraft:"",
    discord:"",
    email:"",
    answers:{},
    hasCard:null,
    receipt:null,
    practiceId:"CC-" + Date.now().toString(36).toUpperCase()
};

const questions = [
"Data di nascita",
"Qual è il tuo Paese di provenienza?",
"Per quale motivo desideri entrare a CipoCity?",
"Quanto tempo prevedi di rimanere?",
"Hai già visitato CipoCity in passato?",
"Hai precedenti penali?",
"Sei mai stato cacciato da CipoCity?",
"Hai mai consumato cibo avariato?",
"Credi nell'onnipotente?",
"Hai mai visitato agartha?",
"Credi nei rettiliani?",
"Qual è il tuo principale interesse a CipoCity? (turismo, lavoro, commercio, residenza, altro)",
"Sei disposto a ricevere una perquisizione intima?",
"Cos'hai mangiato a colazione?",
"Soffri di disagi della mente?",
"Apprezzi le metro e i sottomarini (comunemente chiamati sommergibili)?",
"Quali lavori hai affrontato in passato (legali e non)?",
"Sei mai stato condannato per evasione fiscale?",
"Mangi la frutta?",
"Ti piacciono le albicocche?",
"Hai informazioni aggiuntive che desideri comunicare?",
"Sei sicuro di volerlo fare?"
];

let qIndex = 0;

function progress(v){ bar.style.width = v + "%"; }
function screen(html){ app.innerHTML = '<div class="card">'+html+'</div>'; }

welcome();

function welcome(){
progress(5);
screen(`
<h1>CipoCity Visa Assistant</h1>
<p>Procedura guidata per la richiesta del visto prima dell'arrivo in città.</p>
<div class="actions">
<button class="primary" onclick="minecraftStep()">Inizia Compilazione</button>
</div>
`);
}

function minecraftStep(){
progress(10);
screen(`
<h2>Nome Minecraft</h2>
<input id="mc" placeholder="Inserisci il tuo username di Minecraft" autofocus>
<div class="actions">
<button class="primary" onclick="saveMinecraft()">Continua</button>
</div>
`);
}

function saveMinecraft(){
const v=document.getElementById("mc").value.trim();
if(!v){alert("Campo obbligatorio");return;}
form.minecraft=v;
discordStep();
}

function discordStep(){
progress(20);
screen(`
<h2>Nome Discord</h2>
<input id="dc" placeholder="Es. utente#1234 o username" autofocus>
<div class="actions">
<button class="primary" onclick="saveDiscord()">Continua</button>
</div>
`);
}

function saveDiscord(){
const v=document.getElementById("dc").value.trim();
if(!v){alert("Campo obbligatorio");return;}
form.discord=v;
emailStep();
}

function emailStep(){
progress(30);
screen(`
<h2>Email CipoCity</h2>
<p>Dato facoltativo per comunicazioni ufficiali.</p>
<input id="mail" placeholder="email@cipocity" autofocus>
<div class="actions">
<button class="primary" onclick="saveEmail()">Continua</button>
</div>
`);
}

function saveEmail(){
form.email=document.getElementById("mail").value.trim();
questionStep();
}

function questionStep(){
progress(30 + ((qIndex/questions.length)*40));
const q = questions[qIndex];
screen(`
<h2>Valutazione personale</h2>
<p style="font-size:13px; color:#64748b; font-weight:600;">Domanda ${qIndex+1} di ${questions.length}</p>
<h3>${q}</h3>
<textarea id="ans" placeholder="Scrivi la tua risposta qui..." autofocus></textarea>
<div class="actions">
<button class="primary" onclick="nextQuestion()">Conferma Risposta</button>
</div>
`);
}

function nextQuestion(){
const a=document.getElementById("ans").value.trim();
if(!a){alert("La risposta è obbligatoria per proseguire.");return;}
form.answers[questions[qIndex]]=a;
qIndex++;
if(qIndex<questions.length){ questionStep(); } else { confirmData(); }
}

function confirmData(){
progress(75);
screen(`
<h2>Conferma Dati</h2>
<div class="summary">
<p><b>Minecraft:</b> ${form.minecraft}</p>
<p><b>Discord:</b> ${form.discord}</p>
<p><b>Email:</b> ${form.email || "Non inserita"}</p>
</div>
<div class="actions">
<button class="primary" onclick="cardQuestion()">Conferma e Procedi</button>
</div>
`);
}

function cardQuestion(){
progress(80);
screen(`
<h2>Possiedi una Carta di CipoCity?</h2>
<div class="actions">
<button class="success" onclick="cardYes()">Sì, la possiedo</button>
<button class="secondary" onclick="cardNo()">No</button>
</div>
`);
}

function cardNo(){ form.hasCard=false; finalReview(); }

function cardYes(){
form.hasCard=true;
screen(`
<h2>Verifica Carta</h2>
<p>Avvicina la tua carta al dispositivo per procedere.</p>
<div class="actions">
<button class="primary" onclick="cardLoading()">Scansione Completata</button>
</div>
`);
}

function cardLoading(){
screen(`
<div style="text-align:center;">
    <h2>Elaborazione</h2>
    <div class="loader"></div>
    <p>Verifica transazione in corso...</p>
</div>
`);
setTimeout(()=>{
screen(`
<h2>Transazione Registrata</h2>
<p>Il pagamento per l'elaborazione pratica è andato a buon fine.</p>
<div class="actions">
<button class="success" onclick="registerReceipt()">Prosegui</button>
</div>
`);
},2500);
}

function registerReceipt(){
const now=new Date();
form.receipt={
amount:"50,00 €",
datetime:now.toLocaleString("it-IT"),
status:"Pagamento Confermato"
};
finalReview();
}

function finalReview(){
progress(100);
let answersHTML="";
for(const [q,a] of Object.entries(form.answers)){
answersHTML+=`<p style="margin-bottom:12px;"><b>${q}</b><br><span style="color:#e2e8f0;">${a}</span></p>`;
}

screen(`
<h2>Riepilogo Pratica</h2>
<div class="badge">In Attesa di Verifica</div>
<p>La tua richiesta è stata registrata. Per la convalida finale contatta <b>@mrsthag</b> su Discord fornendo il PDF ufficiale.</p>

<div class="summary">
<h3 style="font-size:16px; border-bottom:1px solid #334155; padding-bottom:8px;">Dati Richiedente</h3>
<p><b>ID Pratica:</b> ${form.practiceId}</p>
<p><b>Minecraft:</b> ${form.minecraft}</p>
<p><b>Discord:</b> ${form.discord}</p>
<p><b>Email:</b> ${form.email || "-"}</p>
</div>

${form.receipt ? `
<div class="summary">
<h3 style="font-size:16px; border-bottom:1px solid #334155; padding-bottom:8px;">Dettagli Ricevuta</h3>
<p><b>Importo:</b> ${form.receipt.amount}</p>
<p><b>Data:</b> ${form.receipt.datetime}</p>
<p><b>Stato:</b> ${form.receipt.status}</p>
</div>` : ''}

<div class="actions">
<button id="btnDownload" class="primary" onclick="exportPDF()" style="width:100%;">Scarica Visto Ufficiale (PDF)</button>
</div>
`);
}

// Funzione aggiornata per il download diretto
function exportPDF(){
    const btn = document.getElementById("btnDownload");
    btn.innerText = "Generazione PDF in corso...";
    btn.disabled = true;

    const date=new Date().toLocaleString("it-IT");
    let qa="";
    for(const [q,a] of Object.entries(form.answers)){
        qa += `<div class="qa-box"><b>${q}</b><div>${a}</div></div>`;
    }

    const receipt = form.receipt ? `
    <div class="section">
        <div class="section-title">Ricevuta di Transazione</div>
        <div class="row"><b>Importo Corrisposto:</b> <span>${form.receipt.amount}</span></div>
        <div class="row"><b>Data e Ora:</b> <span>${form.receipt.datetime}</span></div>
        <div class="row"><b>Stato:</b> <span>${form.receipt.status}</span></div>
    </div>
    ` : "";

    // Creiamo un elemento invisibile con il contenuto per il PDF
    const element = document.createElement('div');
    element.innerHTML = `
    <div style="font-family: 'Arial', sans-serif; color: #1a1a1a; padding: 20px; line-height: 1.5; font-size: 14px; position: relative; max-width: 800px; margin: 0 auto; background: #fff;">
        
        <style>
            .header { text-align: center; border-bottom: 4px double #1a1a1a; margin-bottom: 30px; padding-bottom: 15px; }
            .header h1 { margin: 0; font-size: 32px; text-transform: uppercase; letter-spacing: 3px; color: #0f172a; }
            .header p { margin: 8px 0 0; font-size: 13px; text-transform: uppercase; font-weight: 600; color: #475569; }
            .section { margin-bottom: 25px; }
            .section-title { background: #f1f5f9; padding: 8px 12px; font-weight: 700; border-left: 4px solid #0f172a; margin-bottom: 15px; font-size: 14px; text-transform: uppercase; }
            .row { display: flex; border-bottom: 1px solid #e2e8f0; padding: 8px 4px; font-size: 13px; }
            .row b { width: 35%; color: #334155; }
            .row span { width: 65%; font-weight: 600; }
            .qa-box { border: 1px solid #cbd5e1; background: #f8fafc; padding: 12px; margin-bottom: 12px; font-size: 13px; border-radius: 4px; }
            .qa-box b { display: block; margin-bottom: 6px; color: #0f172a; }
            .stamp { width: 130px; height: 130px; border: 4px solid #b91c1c; border-radius: 50%; color: #b91c1c; font-weight: bold; display: flex; align-items: center; justify-content: center; text-align: center; position: absolute; right: 20px; top: 100px; opacity: 0.8; transform: rotate(-15deg); font-size: 14px; text-transform: uppercase; box-shadow: inset 0 0 0 2px #b91c1c; }
            .stamp span { border-top: 1px solid #b91c1c; border-bottom: 1px solid #b91c1c; padding: 4px 0; }
            .footer { text-align: center; margin-top: 50px; font-size: 11px; color: #64748b; border-top: 1px solid #cbd5e1; padding-top: 15px; }
        </style>

        <div class="stamp"><span>In Attesa<br>Revisione</span></div>
        
        <div class="header">
            <h1>CipoCity</h1>
            <p>Modulo Ufficiale di Richiesta Visto d'Ingresso</p>
        </div>
        
        <div class="section">
            <div class="section-title">1. Anagrafica e Identificativi</div>
            <div class="row"><b>ID Pratica:</b> <span>${form.practiceId}</span></div>
            <div class="row"><b>Nome Minecraft:</b> <span>${form.minecraft}</span></div>
            <div class="row"><b>Nome Discord:</b> <span>${form.discord}</span></div>
            <div class="row"><b>Email CipoCity:</b> <span>${form.email || "Non comunicata"}</span></div>
            <div class="row"><b>Data Emissione:</b> <span>${date}</span></div>
        </div>

        <div class="section">
            <div class="section-title">2. Valutazione Profilo (Questionario)</div>
            ${qa}
        </div>

        ${receipt}

        <div class="section">
            <div class="section-title">3. Disposizioni Finali</div>
            <p style="font-size: 13px; text-align: justify; padding: 0 4px;">
                Il presente modulo ha validità unicamente per l'avvio della pratica di immigrazione. 
                Per completare l'iter e ottenere l'approvazione definitiva, il richiedente deve mettersi in contatto con l'ufficiale preposto <b>@mrsthag</b> tramite la piattaforma Discord, allegando copia del presente documento.
            </p>
        </div>

        <div class="footer">
            Documento generato elettronicamente dal sistema CipoCity Government &copy; ${new Date().getFullYear()}.<br>
            Qualsiasi contraffazione del presente modulo comporterà sanzioni permanenti.
        </div>
    </div>
    `;

    // Configurazioni per html2pdf
    const opt = {
        margin:       10,
        filename:     `Visto_CipoCity_${form.practiceId}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    // Genera e scarica
    html2pdf().set(opt).from(element).save().then(() => {
        btn.innerText = "Scarica Visto Ufficiale (PDF)";
        btn.disabled = false;
    });
}
</script>
</body>
</html>
